version: 2

project_name: tapd

before:
  hooks:
    - go mod tidy -compat=1.25.0

builds:
  - id: tapd
    main: ./cmd/tapd
    binary: tapd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tapd
    ids:
      - tapd
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

brews:
  - name: tapd
    ids:
      - tapd
    repository:
      owner: go-tapd
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/go-tapd/cli"
    description: "TAPD command line client"
    license: "MIT"
    commit_msg_template: "chore: update tapd to {{ .Tag }}"
    commit_author:
      name: go-tapd-bot
      email: actions@github.com
    install: |
      bin.install "tapd"
    test: |
      system "#{bin}/tapd", "--help"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
